    <div id="hero" class="hero-client-gallery">

      <input type="password" id="pin-code" placeholder="Enter PIN" />
      <button onclick="checkPin()">Verify</button>
      <p id="pin-error" style="color: rgb(252, 252, 252); font-size: 20px"></p>
    </div>

    <div
      id="gallery-section"
      class="client-photo-gallery"
      style="display: none"
    >
      <!-- <h2>Welcome to your photo gallery</h2> -->
      <div id="gallery"></div>
      <button

    </div>

    <div id="reviewModal" class="modal-review">
