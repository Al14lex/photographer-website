<html lang="en">
  <head>
    <meta charset="UTF-8" />

      sizes="96x96"

      rel="apple-touch-icon"
      sizes="180x180"

    />

    <link rel="stylesheet" href="/css/styles.css" />

  <body>
    <load ="/partials/home/header-sec.html" />
    <load ="/partials/mobile-menu.html" />
    <load ="/partials/hero-sec.html" />
    <load ="/partials/home/about_me-sec.html" />
    <load ="/partials/home/what-sec.html" />
    <load ="/partials/home/portfolio-sec.html" />
    <load ="/partials/home/reviews-sec.html" />
    <load ="/partials/home/review-modal.html" />
    <load ="/partials/footer-sec.html" />
    <load ="/partials/home/modal.html" />
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", function (event) {
            event.preventDefault();
            const url = this.getAttribute("href");
            history.pushState(null, "", url);
            loadPage(url);
          });
        });

        function loadPage(url) {
          fetch(url)
            .then((response) => response.text())
            .then((html) => {
              document.body.innerHTML = html;
              document.title = url;
            })
            .catch(() => {
              document.body.innerHTML = "<h1>404 Not Found</h1>";
            });
        }
      });
    </script>

    <script type="module" src="/js/home/check-admin.js"></script>

    <script type="module" src="/js/home/reviews.js"></script>

    <script>
      emailjs.init("w78d87LS8NmzMC5tY");
    </script>
  </body>
</html>
