<div id="bookingModal" class="booking-modal">
  <div class="booking-get-in-container">
    <span class="booking-close">&times;</span>
    <h2 class="contact-title">
      Thank you for ordering <span id="shootingType"></span>
    </h2>
    <h3 class="contact-small-title">Please leave your contact details</h3>
    <form class="contact-form" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="user_name"></label>
        <input
          type="text"
          id="user_name"
          name="user_name"
          required
          class="form-input"
          placeholder="Your Name"
          autocomplete="new-password"
        />
      </div>
      <div class="form-group">
        <label for="user_email"></label>
        <input
          type="email"
          id="user_email"
          name="user_email"
          required
          class="form-input"
          placeholder="Your Email"
          autocomplete="off"
        />
      </div>
      <div class="form-group">
        <label for="user_phone"></label>
        <input
          type="tel"
          id="user_phone"
          name="user_phone"
          required
          class="form-input"
          placeholder="Your Phone"
          autocomplete="off"
        />
      </div>
      <div class="form-group">
        <label for="message"></label>
        <textarea
          id="message"
          name="message"
          rows="5"
          maxlength="250"
          class="form-textarea"
          placeholder="Message"
        ></textarea>
      </div>
      <div>
        <button type="submit" class="form-button">Send</button>
      </div>
    </form>
  </div>
</div>
